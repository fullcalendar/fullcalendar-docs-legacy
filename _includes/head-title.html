<title>
  {% if page.full_title %}
    {{ page.full_title | escape }}
  {% elsif page.is_docs %}
    {% if page.slug == 'index' %}
      Documentation
    {% else %}
      {{ page.title | escape }} - Docs
    {% endif %}
    {% if page.version %}
      {{ page.version.id | escape }}
    {% endif %}
    | FullCalendar
  {% else %}
    {{ page.title | escape }}
    | FullCalendar {% if page.layout == 'blog-post' %}Blog{% endif %}
  {% endif %}
</title>
